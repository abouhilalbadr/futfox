# Builds the extension zip for a version tag (for example v0.3.0), signs it with Sigstore
# (keyless, tied to this workflow) and publishes both files as a GitHub Release. Tests already
# have to pass before anything reaches main, so this job only packages and signs.
# Check a download with:
#   cosign verify-blob futfox-0.3.0.zip --bundle futfox-0.3.0.zip.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/abouhilalbadr/futfox/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the extension zip
        run: zip -r -X "futfox-$VERSION.zip" manifest.json icons src LICENSE
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the zip
        run: cosign sign-blob --yes --bundle "futfox-$VERSION.zip.sigstore.json" "futfox-$VERSION.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "futfox-$VERSION.zip" "futfox-$VERSION.zip.sigstore.json" --repo "$GITHUB_REPOSITORY" --title "FutFox $VERSION" --generate-notes
