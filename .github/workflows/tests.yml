# Runs the test suite on every push and pull request. It includes
# test/read-only.test.js, which fails if any source file calls an
# account-changing Web App method (bid, buy, list, move, save, submit).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
